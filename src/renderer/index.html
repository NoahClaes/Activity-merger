<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <title>Activity Merger</title>
    <script src="theme-init.js"></script>
    <link rel="stylesheet" href="../../dist/uPlot.min.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 12h4l2-5 4 10 2-5h6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span>Activity Merger</span>
        <button id="version-btn" class="version-chip" title="Check for updates" hidden></button>
      </div>

      <nav class="tabs" role="tablist" aria-label="View">
        <button class="tab" role="tab" data-tab="files" id="tab-files">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Files &amp; data
        </button>
        <button class="tab" role="tab" data-tab="charts" id="tab-charts">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M3 17l5-6 4 4 8-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Charts
        </button>
      </nav>

      <div class="topbar-actions">
        <div class="theme-switch" role="radiogroup" aria-label="Theme">
          <button data-theme-choice="light" title="Light" aria-label="Light theme">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button data-theme-choice="system" title="Follow Windows" aria-label="Follow system theme">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 20h8M12 16v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button data-theme-choice="dark" title="Dark" aria-label="Dark theme">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <button id="open-btn" class="btn on-header">+ Add files</button>
        <div class="export-group">
          <select id="format" aria-label="Export format">
            <option value="fit">FIT</option>
            <option value="tcx">TCX</option>
            <option value="gpx">GPX</option>
          </select>
          <button id="export-btn" class="btn export" disabled>Export…</button>
        </div>
      </div>
    </header>

    <div id="update-bar" class="update-bar" hidden></div>
    <main class="main">
      <section id="view-files" class="view"></section>
      <section id="view-charts" class="view" hidden>
        <div id="selection-bar" class="selection-bar" hidden></div>
        <div id="charts" class="charts"></div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" hidden></div>
    <div id="drop-overlay" class="drop-overlay" hidden><div>Drop to add files</div></div>
    <input id="file-input" type="file" multiple accept=".fit,.tcx,.gpx,.zip" hidden />
    <script src="../../dist/renderer.js"></script>
  </body>
</html>
