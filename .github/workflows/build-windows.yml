name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release with this version tag (e.g. v1.0.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: |
          npm run samples
          npm test

      - name: Build installer and portable app
        run: npm run build && npx electron-builder --win nsis portable --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: activity-merger-windows
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: gh release create "$TAG" release/*.exe release/latest.yml release/*.blockmap --target "$GITHUB_SHA" --title "Activity Merger $TAG" --generate-notes
